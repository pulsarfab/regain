# Build, sign and publish the plugin package.
#
# Order matters. build.ps1 splits into -StageOnly and -PackageOnly so signing
# can happen between them: the NINA manifest pins the archive's SHA-256, so the
# DLLs and the SDK host must be signed BEFORE Compress-Archive runs. Signing
# after packaging would invalidate the manifest; signing only the archive is
# not possible (a zip carries no Authenticode signature) and would leave the
# programs users actually run unsigned.
#
# ASICamera2.dll is deliberately not signed: it is ZWO's vendor binary and
# carries their signature, not ours.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    # Load-bearing: the Entra federated credential subject must match
    # repo:pulsarfab@279567456/regain@1369114153:environment:release. Without
    # this line the OIDC token carries a different subject and azure/login
    # fails with an unhelpful audience/subject error.
    environment: release
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-docs
      - name: Check source and tag versions
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { ./scripts/version.ps1 -Tag $env:REF_NAME } else { ./scripts/version.ps1 }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Test capture recovery and NINA integration contract
        run: ./scripts/test.ps1

      # ---- 1. build and stage (unsigned) ----------------------------------
      - name: Build and stage the package
        run: ./scripts/build.ps1 -StageOnly
      - name: Stage ASCOM frontend
        run: ./scripts/build-ascom.ps1 -StageOnly

      # ---- 2. sign the programs -------------------------------------------
      - name: Authenticate to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the plugin and the SDK host
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\artifacts\stage\Regain.NINA.dll
            ${{ github.workspace }}\artifacts\stage\Regain.Core.dll
            ${{ github.workspace }}\artifacts\stage\Regain.Rotator.dll
            ${{ github.workspace }}\artifacts\stage\regain-caa.exe
            ${{ github.workspace }}\artifacts\stage\regain-accessories.exe
            ${{ github.workspace }}\artifacts\stage\regain-ofp2.exe
            ${{ github.workspace }}\artifacts\stage\regain-fc3.exe
            ${{ github.workspace }}\artifacts\stage\regain-host.exe
            ${{ github.workspace }}\artifacts\stage\regain-direct.exe
            ${{ github.workspace }}\artifacts\stage\regain-alpaca.exe
            ${{ github.workspace }}\artifacts\stage\regain-camera.exe
            ${{ github.workspace }}\artifacts\ascom-stage\Regain.ASCOM.dll
            ${{ github.workspace }}\artifacts\ascom-stage\Regain.ASCOM.Register.exe
            ${{ github.workspace }}\artifacts\ascom-stage\Regain.FocusCube.ASCOM.exe
            ${{ github.workspace }}\artifacts\ascom-stage\Regain.Ofp2.ASCOM.exe
            ${{ github.workspace }}\artifacts\ascom-stage\Regain.Rotator.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # Assert rather than assume: a signature that does not chain, or chains
      # to the wrong publisher, must not reach the archive.
      - name: Verify every signature
        run: |
          foreach ($f in 'Regain.NINA.dll','Regain.Core.dll','Regain.Rotator.dll','regain-caa.exe','regain-accessories.exe','regain-ofp2.exe','regain-fc3.exe','regain-host.exe','regain-direct.exe','regain-camera.exe','regain-alpaca.exe') {
            $sig = Get-AuthenticodeSignature -LiteralPath "artifacts/stage/$f"
            if ($sig.Status -ne 'Valid') { throw "$f signature is $($sig.Status)" }
            if ($sig.SignerCertificate.Subject -notmatch 'StackFoundry LLC') { throw "$f has unexpected signer: $($sig.SignerCertificate.Subject)" }
            Write-Output "OK  $f  $($sig.SignerCertificate.Subject)"
          }
          foreach ($f in 'Regain.ASCOM.dll','Regain.ASCOM.Register.exe','Regain.FocusCube.ASCOM.exe','Regain.Ofp2.ASCOM.exe','Regain.Rotator.dll') {
            $sig = Get-AuthenticodeSignature -LiteralPath "artifacts/ascom-stage/$f"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'StackFoundry LLC') { throw "Invalid ASCOM signature: $f" }
          }

      # ---- 3. package the signed payload ----------------------------------
      - name: Package and validate NINA manifest
        run: ./scripts/build.ps1 -PackageOnly
      - name: Package signed ASCOM frontend and Rust server
        run: ./scripts/build-ascom.ps1 -PackageOnly
      - name: Install installer compiler
        run: ./scripts/install-inno.ps1
      - name: Build signed ASCOM installer and uninstaller
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Force -Repository PSGallery
          ./scripts/build-ascom-installer.ps1 -Signed
      - uses: actions/upload-artifact@v7
        with:
          name: Regain-ASCOM-installer
          path: |
            artifacts/Regain-ASCOM-*-setup.exe
            artifacts/Regain-ASCOM-*-setup.exe.sha256
          if-no-files-found: error
      - name: Test signed ASCOM installation and removal
        run: ./scripts/test-ascom-installer.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ASCOM-installer-test-logs
          path: artifacts/installer-test/*.log
      - name: Test registry publication checks without remote writes
        run: ./scripts/test-release.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install camera kit build dependencies
        run: python -m pip install -r scripts/camera-kit/requirements.txt
      - name: Test and prepare camera kit with the signed SDK host
        id: kit
        run: |
          python -m unittest discover -s scripts/camera-kit
          if ($LASTEXITCODE) { throw 'Camera kit tests failed.' }
          python scripts/camera-kit/build.py --prepare-only
          if ($LASTEXITCODE) { throw 'Camera kit build failed.' }
      - name: Sign camera kit executable
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ steps.kit.outputs.kit_path }}\Regain-CameraKit.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify and package signed camera kit
        env:
          KIT_PATH: ${{ steps.kit.outputs.kit_path }}
        run: |
          foreach ($f in 'Regain-CameraKit.exe','regain-host.exe') {
            $sig = Get-AuthenticodeSignature -LiteralPath (Join-Path $env:KIT_PATH $f)
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'StackFoundry LLC') { throw "Invalid kit signature: $f" }
          }
          & (Join-Path $env:KIT_PATH 'Regain-CameraKit.exe') --self-test --include-pixels --output artifacts/signed-kit-self-test
          if ($LASTEXITCODE) { throw 'Signed camera kit smoke test failed.' }
          python scripts/camera-kit/build.py --package $env:KIT_PATH
          if ($LASTEXITCODE) { throw 'Signed camera kit packaging failed.' }
      - uses: actions/upload-artifact@v7
        with:
          name: Regain-${{ steps.version.outputs.value }}
          path: |
            artifacts/Regain-${{ steps.version.outputs.value }}.zip
            artifacts/Regain-${{ steps.version.outputs.value }}.manifest.json
            artifacts/regain.png
            artifacts/SHA256SUMS
            artifacts/Regain-CameraKit-${{ steps.version.outputs.value }}-win-x64.zip
            artifacts/Regain-CameraKit-${{ steps.version.outputs.value }}-win-x64.zip.sha256
            artifacts/Regain-ASCOM-${{ steps.version.outputs.value }}-win-x64.zip
            artifacts/Regain-ASCOM-${{ steps.version.outputs.value }}-win-x64.zip.sha256
            artifacts/Regain-ASCOM-${{ steps.version.outputs.value }}-win-x64-setup.exe
            artifacts/Regain-ASCOM-${{ steps.version.outputs.value }}-win-x64-setup.exe.sha256
          if-no-files-found: error
      - name: Create or refresh draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $assets = @("artifacts/Regain-$env:RELEASE_VERSION.zip", "artifacts/Regain-$env:RELEASE_VERSION.manifest.json", 'artifacts/regain.png', 'artifacts/SHA256SUMS', "artifacts/Regain-CameraKit-$env:RELEASE_VERSION-win-x64.zip", "artifacts/Regain-CameraKit-$env:RELEASE_VERSION-win-x64.zip.sha256")
          $assets += @("artifacts/Regain-ASCOM-$env:RELEASE_VERSION-win-x64.zip", "artifacts/Regain-ASCOM-$env:RELEASE_VERSION-win-x64.zip.sha256")
          $assets += @("artifacts/Regain-ASCOM-$env:RELEASE_VERSION-win-x64-setup.exe", "artifacts/Regain-ASCOM-$env:RELEASE_VERSION-win-x64-setup.exe.sha256")
          $existing = gh release view $tag --repo pulsarfab/regain --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'Never replace assets of a published release.' }
            gh release upload $tag @assets --repo pulsarfab/regain --clobber
          } else {
            gh release create $tag @assets --repo pulsarfab/regain --verify-tag --draft --title "PulsarFab regain $env:RELEASE_VERSION" --notes-file docs/release-notes.md
          }
          if ($LASTEXITCODE) { throw 'Draft release publication failed.' }
