name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ascom-registration:
    name: Windows COM activation
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/ZwoGain.ASCOM.Register -c Release
      - run: ./scripts/test-ascom-registration.ps1
        shell: pwsh
  rust-portable:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK runtime dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install libusb
          else
            sudo apt-get update
            sudo apt-get install -y libusb-1.0-0
          fi
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --release --locked
      - run: cargo test --workspace --locked
        env:
          ZWOGAIN_TEST_WORKERS: ${{ github.workspace }}/target/release
      - name: Exercise standalone Alpaca server
        run: python scripts/test-alpaca.py --bin-dir target/release
      - name: Exercise native camera pipe
        run: python scripts/test-native-camera.py --bin-dir target/release
      - name: Exercise Alpaca CAA rotator
        run: python scripts/test-alpaca-rotator.py --bin-dir target/release
      - name: Exercise Alpaca EFW and EAF
        run: python scripts/test-alpaca-accessories.py --bin-dir target/release
      - name: Exercise native OFP2 and Alpaca CoverCalibrator
        run: python scripts/test-ofp2.py --bin-dir target/release
      - name: Load and enumerate with the real ZWO SDK
        run: python scripts/stage-sdk.py target/release --check
      - name: Check worker protocol and native SDK ABI
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            library=target/libportable_sdk.dylib
            cc -Wall -Wextra -Werror -dynamiclib tests/fixtures/portable_sdk.c -o "$library"
          else
            library=target/libportable_sdk.so
            cc -Wall -Wextra -Werror -shared -fPIC tests/fixtures/portable_sdk.c -o "$library"
          fi
          python scripts/test-rust.py --bin-dir target/release --sdk-fixture "$library"
      - name: Package workers for hardware testing
        run: python scripts/package-rust.py
      - name: Package standalone native CAA driver
        run: cargo run -p zwogain-caa --release --locked -- list
      - name: Archive standalone native CAA driver
        run: python scripts/package-rust.py --caa-only
      - uses: actions/upload-artifact@v4
        with:
          name: zwogain-caa-${{ matrix.os }}
          path: |
            zwogain-caa-*.zip
            zwogain-caa-*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: zwogain-rust-${{ matrix.os }}
          path: |
            zwogain-rust-*.tar.gz
            zwogain-rust-*.tar.gz.sha256
          if-no-files-found: error
  research-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/inspection/requirements.txt
      - run: python -m unittest discover -s scripts/inspection -p "test_*.py"
      - run: python -m unittest discover -s scripts/camera-kit -p "test_*.py"
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-docs
      - run: ./scripts/test.ps1
        shell: pwsh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-rust.py
      - run: python scripts/test-alpaca.py
      - run: ./scripts/build.ps1
        shell: pwsh
      - name: Package standalone native CAA driver
        run: cargo run -p zwogain-caa --release --locked -- list
      - name: Archive standalone native CAA driver
        run: python scripts/package-rust.py --caa-only
      - uses: actions/upload-artifact@v4
        with:
          name: zwogain-caa-windows
          path: |
            zwogain-caa-*.zip
            zwogain-caa-*.zip.sha256
          if-no-files-found: error
      - run: ./scripts/build-ascom.ps1
        shell: pwsh
      - run: ./scripts/install-inno.ps1
        shell: pwsh
      - run: ./scripts/build-ascom-installer.ps1
        shell: pwsh
      - run: ./scripts/test-ascom-installer.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ASCOM-installer-test-logs
          path: artifacts/installer-test/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: ZwoGain-ASCOM
          path: artifacts/ZwoGain-ASCOM-*
          if-no-files-found: error
      - run: ./scripts/test-release.ps1
        shell: pwsh
      - run: python -m pip install -r scripts/camera-kit/requirements.txt
      - name: Build and exercise standalone camera kit
        run: python scripts/camera-kit/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZwoGain-camera-kit
          path: |
            artifacts/ZwoGain-CameraKit-*-win-x64.zip
            artifacts/ZwoGain-CameraKit-*-win-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ZwoGain-plugin
          path: |
            artifacts/ZwoGain-*.zip
            !artifacts/ZwoGain-CameraKit-*.zip
            !artifacts/ZwoGain-ASCOM-*.zip
            artifacts/ZwoGain-*.manifest.json
            artifacts/zwogain.png
            artifacts/SHA256SUMS
          if-no-files-found: error
