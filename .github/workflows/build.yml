name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/inspection/requirements.txt
      - run: python -m unittest discover -s scripts/inspection -p "test_*.py"
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-docs
      - run: ./scripts/test.ps1
        shell: pwsh
      - run: ./scripts/build.ps1
        shell: pwsh
      - run: ./scripts/test-release.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ZwoGain-plugin
          path: |
            artifacts/ZwoGain-*.zip
            artifacts/ZwoGain-*.manifest.json
            artifacts/zwogain.png
            artifacts/SHA256SUMS
          if-no-files-found: error
