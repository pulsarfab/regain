[package]
name = "regain-direct"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nusb = "0.2.7"
libc = "0.2"
