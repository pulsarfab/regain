[package]
name = "zwogain-caa"
description = "SDK-independent ZWO CAA USB HID rotator driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
