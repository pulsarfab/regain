[package]
name = "regain-hub"
description = "Shared device aggregation, safety policy and configuration for PulsarFab regain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[[test]]
name = "endpoint_process"
harness = false

[dependencies]
anyhow = "1"
regain-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2.2", features = ["uuid1"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "process", "io-util", "net"] }
tempfile = "3"
url = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
httpdate = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["test-util"] }
