[package]
name = "zwogain-ofp2"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust USB serial driver for the Deep Sky Dad OFP2 flat panel"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Use the Rust OS backends; no libudev, vendor SDK, or ASCOM runtime required.
serialport = { version = "4.9", default-features = false }
