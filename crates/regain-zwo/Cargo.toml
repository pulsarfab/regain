[package]
name = "regain-zwo"
description = "ZWO camera, rotator, filter wheel and focuser protocols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND MIT"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["astronomy", "astrophotography", "zwo", "camera", "usb"]
categories = ["science", "hardware-support"]

[features]
default = ["asi-direct", "asi-sdk", "caa", "accessories"]
asi-direct = ["dep:regain-core", "dep:sha2", "dep:nusb", "dep:libc", "dep:windows-sys", "windows-sys?/Win32_System_IO", "windows-sys?/Win32_System_Threading", "windows-sys?/Win32_System_LibraryLoader"]
asi-sdk = ["dep:libloading", "dep:regain-core"]
hid = ["dep:libc", "dep:windows-sys", "windows-sys?/Win32_Devices_HumanInterfaceDevice"]
caa = ["hid"]
accessories = ["hid", "dep:regain-core"]

[dependencies]
regain-core = { workspace = true, optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regain-worker.workspace = true
regain-transport.workspace = true
sha2 = { version = "0.10", optional = true }
libloading = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nusb = { version = "0.2.7", optional = true }
libc = { version = "0.2", optional = true }
