[workspace]
members = ["crates/regain-device", "crates/regain-core", "crates/regain-alpaca", "crates/regain-zwo", "crates/regain-pegasus", "crates/regain-deepskydad", "crates/regain-wanderer", "crates/regain-transport", "crates/regain-worker"]
resolver = "3"

[workspace.package]
version = "0.5.12"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Yann Ramin"]
repository = "https://github.com/pulsarfab/regain"
homepage = "https://pulsarfab.com/docs/regain/"

# Keep these versions equal to workspace.package.version; crates.io needs them.
[workspace.dependencies]
regain-core = { path = "crates/regain-core", version = "0.5.12" }
regain-deepskydad = { path = "crates/regain-deepskydad", version = "0.5.12" }
regain-pegasus = { path = "crates/regain-pegasus", version = "0.5.12" }
regain-transport = { path = "crates/regain-transport", version = "0.5.12" }
regain-wanderer = { path = "crates/regain-wanderer", version = "0.5.12" }
regain-worker = { path = "crates/regain-worker", version = "0.5.12" }
regain-zwo = { path = "crates/regain-zwo", version = "0.5.12" }
